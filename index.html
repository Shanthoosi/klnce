<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
                .login-container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 10px;
            width: 320px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .login-container img {
            width: 120px;
            margin-bottom: 15px;
        }
        .login-container input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
        }
        .login-container button {
            padding: 10px 20px;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- College Logo -->
    <img src="https://www.klnce.edu/images/klncelogo.gif" alt="College Logo">

    <!-- Login Form -->
    <form>
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
